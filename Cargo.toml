[workspace]
members = [
    ".",
    "crates/phi-save-codec",
]
resolver = "3"

[package]
name = "phi-backend"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.lints.clippy]
# 文档注释以中文为主，`doc_markdown` 会产生大量误报并污染注释文本。
doc_markdown = "allow"
# 能 const 的函数就 const（nursery 组，对健壮性无直接帮助，但利于编译器优化）
missing_const_for_fn = "warn"
# 生产代码禁止 panic!（restriction 组；测试代码通过 cfg_attr(test, allow) 豁免）
panic = "warn"
# 禁止无上下文 panic 的 unwrap（restriction 组；测试代码通过 cfg_attr(test, allow) 豁免）
unwrap_used = "warn"
# 禁止 expect；生产代码中的 expect 均为数学/密码学/配置不变量，已就地 allow 并注明原因
expect_used = "warn"

[lints]
workspace = true

[dependencies]
# 内部 crate
phi-save-codec = { path = "crates/phi-save-codec" }
# 核心异步与服务框架
tokio = { version = "1.41", features = ["full"] }
axum = "0.8.9"
async-trait = "0.1"
tower-http = { version = "0.7", features = ["fs", "compression-br", "compression-gzip", "cors"] }

# 序列化与JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
minijinja = { version = "2.14", features = ["loader"] }
unicode-width = "0.2"

# 错误处理与日志
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 网络请求与加密工具
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-native-roots"] }
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
jsonwebtoken = "9.3"
zip = "2.2"
flate2 = "1.0"
base64 = "0.22"
hex = "0.4"
ed25519-dalek = "2"
csv = "1.3"
serde_yaml = "0.9"
rand = "0.8"
moka = { version = "0.12", features = ["future"] }
futures-util = "0.3"
qrcode = "0.14"
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
gethostname = "0.4"

# SQLite 持久化
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }

# Parquet 导出
parquet = { version = "59.2", features = ["arrow"] }
arrow-array = "59.2"
arrow-schema = "59.2"

# OpenAPI 支持
utoipa = { version = "5.5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }

# 配置文件支持
config = "0.14"
once_cell = "1.20"

# Git 操作
git2 = { version = "0.20", features = ["vendored-openssl"] }

# 时间与日期
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# SVG 渲染为 PNG
resvg = "0.43"
tiny-skia = { version = "0.11", features = ["png"] }
png = "0.17"
image = { version = "0.25", features = ["webp"] }
webp = "0.3.1"
lru = "0.16"
num_cpus = "1.16"

# systemd 支持（仅在Linux下生效）
[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[target.'cfg(unix)'.dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph", "criterion"] }

# 发布产物瘦身（主要针对 linux-musl 静态链接二进制体积）
#
# 使用方式：
# - `cargo build --profile release-dist --target x86_64-unknown-linux-musl`
#
# 说明：
# - `strip="symbols"` 会显著减小体积，但会削弱 backtrace/符号诊断能力；
# - `opt-level="z"` 更偏向体积优化，CPU 开销可能略增。
[profile.release-dist]
inherits = "release"
strip = "symbols"
lto = "fat"
codegen-units = 1
opt-level = 3
