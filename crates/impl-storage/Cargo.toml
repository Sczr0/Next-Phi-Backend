[package]
name = "impl-storage"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

# Phase 1：唯一 sqlx 所在（Charter §3.3 铁律 2）。
# 依赖方向（临时 ALLOW）：impl-storage -> [phi-contract, phi-http]

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "json"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
once_cell = "1.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
tracing = "0.1"
# 生产代码使用 tokio::try_join!（macros）；sqlx runtime-tokio 之外还需 net/time/sync/fs
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "fs"] }
# 开放平台存储（api_keys/developers/events）生成 id 使用
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
# 内部 crate
phi-contract = { path = "../phi-contract" }
phi-http = { path = "../phi-http" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
