[package]
name = "impl-render"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

# Phase 1：渲染实现（SVG 模板 + resvg 光栅化）。重 CPU 依赖隔离在此
# （Charter §3.2：让 resvg/image 不污染契约与业务层）。
# 依赖方向：impl-render -> [impl-rks, phi-common, phi-contract, phi-http]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", features = ["webp"] }
lru = "0.16"
md-5 = "0.10"
minijinja = { version = "2.14", features = ["loader"] }
once_cell = "1.20"
png = "0.17"
rand = "0.8"
resvg = "0.48"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "fs", "sync"] }
tracing = "0.1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "v7", "fast-rng"] }
webp = "0.3.1"
# 内部 crate
impl-rks = { path = "../impl-rks" }
phi-common = { path = "../phi-common" }
phi-contract = { path = "../phi-contract" }
phi-http = { path = "../phi-http" }

[lints]
workspace = true
