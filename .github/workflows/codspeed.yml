# CodSpeed 持续性能监测：渲染（B27 SVG/PNG）+ 存档解码 + RKS 引擎基准。
#
# 认证：OIDC（`id-token: write`），无需配置 `CODSPEED_TOKEN` secret；
# 仓库需已在 https://codspeed.io 安装 CodSpeed GitHub App 并授权。
# 模式：simulation（CPU 指令级模拟，结果确定、低噪声，并自动生成火焰图）。
#
# 基准内容：
# - crates/impl-render/benches/bn_render.rs：B27 SVG 生成 + PNG 光栅化
#   （曲绘 fixture 见 benches/fixtures/，由 tools/gen-render-bench-fixtures.py 生成）
# - crates/impl-save/benches/save_decode.rs：AES-256-CBC 解密 / PBKDF2 派生 /
#   gameRecord 与 summary 解析
# - crates/impl-rks/benches/rks_engine.rs：B30/RKS 计算、推分 ACC 批量求解与回填
# - crates/phi-save-codec/benches/codec.rs：gameRecord 二进制/JSON 与 summary 解析
#
# 本地复现：`cargo bench -p impl-render --bench bn_render` /
#           `cargo bench -p impl-save --bench save_decode`（criterion 原生输出）/
#           `cargo bench -p impl-rks -p phi-save-codec`（divan 原生输出）。
name: CodSpeed

on:
  push:
    branches: [ "master", "feat" ]
  pull_request:
    branches: [ "master", "feat" ]
  # 允许 CodSpeed 触发回溯性能分析以生成初始数据
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # CodSpeed OIDC 认证

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Rust 工具链（rust-toolchain.toml 钉死 1.98.0）
      uses: dtolnay/rust-toolchain@1.98.0
      with:
        toolchain: 1.98.0

    # 缓存键与 quality-gate 分离：codspeed 以独立 profile 构建 bench 目标，
    # 混用会互相驱逐产物（同 build.yml 各矩阵平台独立 key 的理由）。
    - name: 恢复Cargo缓存
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: codspeed-ubuntu
        cache-on-failure: true

    # 预编译二进制，与 bench 侧 codspeed-criterion-compat / codspeed-divan-compat 5.0 配套
    - name: 安装 cargo-codspeed
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-codspeed@5.0.2

    - name: 构建基准测试
      run: cargo codspeed build -m simulation --workspace

    - name: 运行基准测试并上传
      uses: CodSpeedHQ/action@v5
      with:
        mode: simulation
        run: cargo codspeed run --workspace
